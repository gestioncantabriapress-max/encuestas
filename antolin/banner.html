<!-- Banner Directo Antolín · Cantabria FM (podcasts de iVoox) -->
<style>
.cfm-ant-wrap{container-type:inline-size;margin:0 0 24px}
.cfm-ant{display:grid;grid-template-columns:minmax(260px,38%) 1fr;border-radius:12px;overflow:hidden;background:#0e3220;box-shadow:0 2px 10px rgba(0,0,0,.12);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.cfm-ant-foto{position:relative;min-height:440px;background:#123d27 url(https://gestioncantabriapress-max.github.io/encuestas/antolin/foto.jpg) 18% top/cover no-repeat}
.cfm-ant-foto::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(14,50,32,.97) 0,rgba(14,50,32,.75) 32%,rgba(14,50,32,0) 62%)}
.cfm-ant-txt{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:22px 24px;color:#fff}
.cfm-ant-pill{display:inline-block;background:#e30000;color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.cfm-ant .cfm-ant-h{margin:10px 0 4px;padding:0;color:#fff;font:900 34px/1.05 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;text-transform:uppercase;letter-spacing:.01em;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.cfm-ant-emisora{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:rgba(255,255,255,.88)}
.cfm-ant-emisora img{height:40px;width:auto;display:block;margin:0}
.cfm-ant-ivoox{background:#fff;min-width:0}
.cfm-ant-ivoox iframe{display:block;width:100%;height:440px;border:0;margin:0}
@container (max-width:640px){
  .cfm-ant{grid-template-columns:1fr}
  .cfm-ant-foto{min-height:330px;background-position:20% 0}
  .cfm-ant-foto::after{background:linear-gradient(to top,rgba(14,50,32,.97) 0,rgba(14,50,32,.7) 26%,rgba(14,50,32,0) 48%)}
  .cfm-ant .cfm-ant-h{font-size:26px;margin:8px 0 2px}
  .cfm-ant-txt{padding:14px 16px}
  .cfm-ant-emisora{margin-top:6px}
  .cfm-ant-emisora img{height:32px}
}
</style>
<div class="cfm-ant-wrap">
  <section class="cfm-ant" aria-label="Directo Antolín, podcast de Cantabria FM">
    <div class="cfm-ant-foto">
      <div class="cfm-ant-txt">
        <span class="cfm-ant-pill">Podcast</span>
        <div class="cfm-ant-h">Directo Antolín</div>
        <div class="cfm-ant-emisora"><img src="https://gestioncantabriapress-max.github.io/encuestas/antolin/logo.png" alt="Cantabria FM"><span>Escucha los programas</span></div>
      </div>
    </div>
    <div class="cfm-ant-ivoox">
      <iframe src="https://www.ivoox.com/player_es_podcast_156983_1.html" title="Podcasts de Directo Antolín en iVoox" loading="lazy" scrolling="no" allowfullscreen="0"></iframe>
    </div>
  </section>
</div>
