<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados 29-N y pactómetro · CantabriaPress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#0b2117; --fondo2:#123d27; --verde:#2a8647; --verde-cla:#3fbf6a;
    --blanco:#ffffff; --suave:rgba(255,255,255,.72); --tenue:rgba(255,255,255,.12); --borde:rgba(255,255,255,.14);
    --rojo:#e30000;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Roboto,Verdana,Geneva,sans-serif;background:transparent;color:var(--blanco)}
  .rb{position:relative;overflow:hidden;border-radius:10px;color:var(--blanco);
    background:
      radial-gradient(ellipse 60% 80% at 85% 0%, rgba(63,191,106,.28), transparent 60%),
      radial-gradient(ellipse 50% 60% at 0% 100%, rgba(42,134,71,.35), transparent 60%),
      linear-gradient(160deg, var(--fondo2) 0%, var(--fondo) 60%)}
  .num{font-variant-numeric:tabular-nums}

  /* Cabecera */
  .hero{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 26px 16px;border-bottom:1px solid var(--borde)}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--rojo);font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:999px}
  .pill i{width:7px;height:7px;border-radius:50%;background:#fff}
  .hero h1{font-size:34px;font-weight:900;line-height:1;text-transform:uppercase;letter-spacing:-.01em;margin-top:9px}
  .hero h1 span{color:var(--verde-cla)}
  .escr{text-align:right;flex:none}
  .escr .num{font-size:40px;font-weight:900;line-height:1}
  .escr small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);margin-top:4px}
  .prueba{background:#ffd34d;color:#3d2e00;font-size:12px;font-weight:900;letter-spacing:.06em;text-align:center;padding:6px 10px}

  .tabs{display:none}
  .cuerpo{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;padding:20px 26px}
  .card{background:rgba(255,255,255,.05);border:1px solid var(--borde);border-radius:10px;padding:16px 18px}
  .tit{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
  .tit b{color:var(--blanco)}

  /* Congreso */
  .hemi-w{position:relative;max-width:460px;margin:0 auto}
  .hemi{display:block;width:100%}
  .hemi{animation:fundido .8s ease both}
  @keyframes fundido{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .hemi-c{position:absolute;left:0;right:0;bottom:2px;text-align:center}
  .hemi-c .num{font-size:30px;font-weight:900;line-height:1}
  .hemi-c small{display:block;font-size:11px;color:var(--suave);letter-spacing:.06em;text-transform:uppercase}
  .partidos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:14px}
  .pc{background:rgba(255,255,255,.06);border-radius:8px;padding:9px 10px 8px;border-top:4px solid var(--c);min-width:0}
  .pc .n{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pc .num{font-size:30px;font-weight:900;line-height:1.05}
  .pc .d{font-size:11.5px;font-weight:700;color:var(--suave)}
  .pc .ant{font-size:11px;color:var(--suave);margin-top:2px}
  .anio{display:inline-flex;background:var(--tenue);border-radius:999px;padding:3px;gap:2px}
  .anio button{border:0;background:none;color:var(--suave);font:900 11px Roboto,sans-serif;letter-spacing:.06em;padding:5px 10px;border-radius:999px;cursor:pointer}
  .anio button.on{background:var(--blanco);color:var(--fondo)}
  .anio button:focus-visible{outline:2px solid #fff;outline-offset:1px}
  .barra{position:relative;overflow:visible !important}
  .barra > div{border-radius:99px}
  .barra .ant23{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
  .fila .cmp{font-size:11.5px;color:var(--suave);margin-top:4px}
  .ley{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--suave);margin-top:10px}
  .ley i{display:inline-block;width:3px;height:12px;background:#fff;border-radius:2px}
  .sube{color:#7be29c !important}.baja{color:#ff8a8a !important}

  /* Cantabria */
  .cant .seats{display:flex;justify-content:center;gap:8px;margin:6px 0 16px}
  .cseat{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;box-shadow:0 0 0 3px rgba(255,255,255,.15),0 4px 10px rgba(0,0,0,.35);animation:pop .5s both}
  .fila{margin:9px 0}
  .fila .top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:4px}
  .fila .top span{display:flex;align-items:center;gap:7px}
  .fila .top i{width:9px;height:9px;border-radius:50%}
  .barra{height:10px;background:var(--tenue);border-radius:99px;overflow:hidden}
  .barra div{height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
  .part{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--borde);margin-top:14px;padding-top:12px;font-size:13px;color:var(--suave)}
  .part .num{font-size:24px;font-weight:900;color:var(--blanco)}

  /* Pactómetro */
  .pacto{margin:0 26px 22px;background:var(--blanco);color:#111;border-radius:10px;padding:18px 20px}
  .pacto .tit{color:#2a8647}
  .pacto .tit b{color:#111}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:2px solid #e6e6e6;background:#fff;border-radius:999px;padding:7px 12px 7px 9px;font:700 14px Roboto,sans-serif;color:#111;cursor:pointer;transition:transform .12s}
  .chip:hover{transform:translateY(-1px)}
  .chip i{width:11px;height:11px;border-radius:50%;background:var(--c)}
  .chip b{font-weight:900}
  .chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
  .chip[aria-pressed="true"] i{background:#fff}
  .chip:focus-visible{outline:3px solid #2a8647;outline-offset:2px}
  .medidor{position:relative;height:34px;background:#f0f0f0;border-radius:6px;margin:18px 0 4px;display:flex;overflow:hidden}
  .medidor span{height:100%;transition:width .35s cubic-bezier(.2,.7,.2,1)}
  .marca{position:absolute;top:-6px;bottom:-6px;width:3px;background:#111;z-index:1}
  .marca-t{position:relative;height:16px;font-size:12px;font-weight:700}
  .marca-t span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .res{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
  .res .num{font-size:54px;font-weight:900;line-height:1}
  .res .num small{font-size:16px;font-weight:500;color:#767676;margin-left:6px}
  .ver{font-size:14px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;padding:10px 16px;border-radius:999px;background:#f0f0f0;color:#555}
  .ver.si{background:#2a8647;color:#fff}
  .limpiar{background:none;border:0;color:#767676;font:500 12.5px Roboto,sans-serif;text-decoration:underline;cursor:pointer;margin-top:8px}

  .espera{padding:34px 26px 30px;text-align:center}
  .espera .big{font-size:26px;font-weight:900;margin-bottom:8px}
  .espera p{font-size:14px;color:var(--suave);max-width:560px;margin:0 auto;line-height:1.5}
  /* Titulares que van saliendo */
  .tk{display:flex;align-items:stretch;background:rgba(0,0,0,.28);border-bottom:1px solid var(--borde);min-height:44px}
  .tk-l{flex:none;display:flex;align-items:center;gap:7px;background:var(--rojo);font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:0 14px}
  .tk-l i{width:7px;height:7px;border-radius:50%;background:#fff;animation:late 1.2s infinite}
  @keyframes late{50%{opacity:.25}}
  .tk-t{position:relative;flex:1;overflow:hidden}
  .tk-t p{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;font-weight:700;line-height:1.25;opacity:0;transform:translateY(12px);transition:opacity .45s,transform .45s}
  .tk-t p.on{opacity:1;transform:none}
  .tk-t p small{flex:none;font-size:11.5px;font-weight:700;color:var(--verde-cla)}
  .tk-n{flex:none;display:flex;align-items:center;gap:4px;padding:0 12px}
  .tk-n button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.3);cursor:pointer}
  .tk-n button.on{background:#fff}
  .pie{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 26px 14px;font-size:11.5px;color:var(--suave)}
  .pie b{color:var(--blanco)}

  @media (max-width:760px){
    .hero{padding:14px 14px 12px}
    .hero h1{font-size:22px;margin-top:7px}
    .escr .num{font-size:28px}
    .tabs{display:flex;gap:4px;padding:10px 12px 0}
    .tabs button{flex:1;background:var(--tenue);border:0;border-radius:999px;padding:9px 0;color:var(--suave);font:900 12px Roboto,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
    .tabs button.on{background:var(--blanco);color:var(--fondo)}
    .cuerpo{grid-template-columns:1fr;padding:12px;gap:12px}
    .pacto{margin:0 12px 12px;padding:16px 14px}
    .rb[data-tab="cantabria"] .t-es,.rb[data-tab="cantabria"] .t-pa,
    .rb[data-tab="espana"] .t-ca,.rb[data-tab="espana"] .t-pa,
    .rb[data-tab="pacto"] .t-ca,.rb[data-tab="pacto"] .t-es{display:none}
    .rb[data-tab="pacto"] .cuerpo{display:none}
    .res .num{font-size:44px}
    .hemi-c .num{font-size:22px}
    .hemi-c small{font-size:8.5px;letter-spacing:.03em}
    .pie{padding:8px 14px 12px}
    .tk{min-height:58px}
    .tk-l{padding:0 9px;font-size:9.5px}
    .tk-l span{display:none}
    .tk-t p{font-size:13.5px;padding:0 10px}
    .tk-n{display:none}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>
<body>

<div class="rb" id="rb"></div>

<script>
/* ============================================================
   DATOS — lo único que se cambia la noche del 29-N
   La noche del 29-N las tareas programadas rellenan DATA con el escrutinio oficial.
   ============================================================ */
const DATA = {
  datos: false,                         // las tareas de la noche electoral lo ponen en true al subir el escrutinio oficial
  prueba: false,
  escrutado: 0,                         // % escrutado
  actualizado: "",
  espana: {
    total: 350, mayoria: 176,
    participacion: 0, participacion23: 66.6,
    // En orden para el hemiciclo (de izquierda a derecha). s23 = escaños en 2023 (null si no se presentaba)
    partidos: [],
    // Congreso en las generales del 23-J de 2023 (resultado oficial), para comparar
    anterior: {
      titulo: "23-J 2023",
      partidos: [
        { n: "Sumar", s: 31,  c: "#e4366e" },
        { n: "PSOE",  s: 121, c: "#e30613" },
        { n: "ERC",   s: 7,   c: "#f2b10c" },
        { n: "Bildu", s: 6,   c: "#1aa6a6" },
        { n: "PNV",   s: 5,   c: "#2e8b57" },
        { n: "BNG",   s: 1,   c: "#76b4e0" },
        { n: "Junts", s: 7,   c: "#00c3b2" },
        { n: "CC",    s: 1,   c: "#ffd200" },
        { n: "UPN",   s: 1,   c: "#1f4e9a" },
        { n: "PP",    s: 137, c: "#1d84ce" },
        { n: "Vox",   s: 33,  c: "#5ac035" }
      ]
    }
  },
  cantabria: {
    participacion: 0, participacion23: 69.9,
    // v = % de voto; s = diputados (suman 5); v23/s23 = 2023 (null si el partido no se presentaba)
    partidos: []
  },
  fuente: "",
  // Titulares escritos por las tareas de la noche (más reciente primero). Si está vacío, salen titulares automáticos con los datos.
  titulares: []   // { hora: "21:40", t: "Escrutado el 50 %: ..." }
};

/* Datos inventados solo para ver el diseño: se usan si la dirección termina en #prueba */
const PRUEBA = {
  datos: true,
  prueba: true,
  escrutado: 100,                       // % escrutado
  actualizado: "29 nov 2026, 23:59",
  espana: {
    total: 350, mayoria: 176,
    participacion: 70.0, participacion23: 66.6,
    // En orden para el hemiciclo (de izquierda a derecha). s23 = escaños en 2023 (opcional)
    partidos: [
      { n: "Frente Amplio", s: 20,  s23: null, c: "#e4366e" },
      { n: "PSOE",          s: 110, s23: 121,  c: "#e30613" },
      { n: "ERC",           s: 7,   s23: 7,    c: "#f2b10c" },
      { n: "Bildu",         s: 6,   s23: 6,    c: "#1aa6a6" },
      { n: "PNV",           s: 5,   s23: 5,    c: "#2e8b57" },
      { n: "Junts",         s: 7,   s23: 7,    c: "#00c3b2" },
      { n: "Otros",         s: 4,   s23: null, c: "#c9cdd3" },
      { n: "PP",            s: 135, s23: 137,  c: "#1d84ce" },
      { n: "Vox",           s: 56,  s23: 33,   c: "#5ac035" }
    ],
    // Congreso en las generales del 23-J de 2023 (resultado oficial), para comparar
    anterior: {
      titulo: "23-J 2023",
      partidos: [
        { n: "Sumar", s: 31,  c: "#e4366e" },
        { n: "PSOE",  s: 121, c: "#e30613" },
        { n: "ERC",   s: 7,   c: "#f2b10c" },
        { n: "Bildu", s: 6,   c: "#1aa6a6" },
        { n: "PNV",   s: 5,   c: "#2e8b57" },
        { n: "BNG",   s: 1,   c: "#76b4e0" },
        { n: "Junts", s: 7,   c: "#00c3b2" },
        { n: "CC",    s: 1,   c: "#ffd200" },
        { n: "UPN",   s: 1,   c: "#1f4e9a" },
        { n: "PP",    s: 137, c: "#1d84ce" },
        { n: "Vox",   s: 33,  c: "#5ac035" }
      ]
    }
  },
  cantabria: {
    participacion: 71.0, participacion23: 69.9,
    // v = % de voto; s = diputados (suman 5); v23/s23 = 2023 (null si el partido no se presentaba)
    partidos: [
      { n: "PP",            v: 40.0, s: 2, v23: 42.1, s23: 2, c: "#1d84ce" },
      { n: "PSOE",          v: 30.0, s: 2, v23: 33.3, s23: 2, c: "#e30613" },
      { n: "Vox",           v: 18.0, s: 1, v23: 14.1, s23: 1, c: "#5ac035" },
      { n: "Frente Amplio", v: 6.0,  s: 0, v23: null, s23: null, c: "#e4366e" }
    ]
  },
  fuente: "Ministerio del Interior, resultados provisionales."
};

/* ============================================================
   LÓGICA
   ============================================================ */
const el = document.getElementById("rb");
const fmt = n => n.toLocaleString("es-ES",{minimumFractionDigits:1,maximumFractionDigits:1});
const VER = location.hash === "#prueba" ? PRUEBA : DATA;
const E = VER.espana, C = VER.cantabria;
const sinMov = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const sigla = n => n.length > 5 ? n.split(" ").map(w=>w[0]).join("") : n;

function hemicycle(p, total){
  const rows = 10, R0 = 40, R1 = 120, cx = 130, cy = 128;
  const radii = Array.from({length:rows},(_,i)=>R0+(R1-R0)*i/(rows-1));
  const sumR = radii.reduce((a,b)=>a+b,0);
  let counts = radii.map(r=>Math.round(total*r/sumR));
  counts[rows-1] += total - counts.reduce((a,b)=>a+b,0);
  const pts = [];
  radii.forEach((r,i)=>{ const k = counts[i];
    for(let j=0;j<k;j++){ const a = Math.PI - Math.PI*(j/(k-1||1)); pts.push({a, x: cx + r*Math.cos(a), y: cy - r*Math.sin(a)}); } });
  pts.sort((p1,p2)=>p2.a-p1.a);
  const colors = []; p.forEach(x=>{for(let i=0;i<x.s;i++)colors.push(x.c)});
  while(colors.length<total)colors.push("rgba(255,255,255,.15)");
  const dots = pts.map((q,i)=>`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3.7" fill="${colors[i]}"/>`).join("");
  return `<svg class="hemi" viewBox="0 0 260 132" role="img" aria-label="Reparto de escaños del Congreso">${dots}
    <line x1="130" y1="0" x2="130" y2="14" stroke="#fff" stroke-width="1.4" stroke-dasharray="2 2"/></svg>`;
}

// Números que cuentan hacia arriba al aparecer
function contar(raiz){
  raiz.querySelectorAll("[data-num]").forEach(n=>{
    const fin = +n.dataset.num, dec = +(n.dataset.dec||0), suf = n.dataset.suf||"";
    const pinta = v => n.textContent = (dec ? v.toLocaleString("es-ES",{minimumFractionDigits:dec,maximumFractionDigits:dec}) : Math.round(v)) + suf;
    if (sinMov){ pinta(fin); return; }
    const t0 = performance.now(), dur = 900;
    (function paso(t){ const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3); pinta(fin*e); if(k<1) requestAnimationFrame(paso); })(t0);
  });
}

/* Titulares automáticos, solo con datos (sin valoraciones) */
function titularesAuto(){
  const T = [], ord = [...E.partidos].filter(x=>x.n!=="Otros").sort((a,b)=>b.s-a.s);
  const esc = n => n + (n===1?" escaño":" escaños");
  const cant = C.partidos.filter(x=>x.s>0).map(x=>`${x.n} ${x.s}`).join(", ");
  if (cant) T.push(`Cantabria reparte sus 5 diputados: ${cant}`);
  const cv = [...C.partidos].sort((a,b)=>b.v-a.v)[0];
  if (cv) T.push(`${cv.n}, primera fuerza en Cantabria con el ${fmt(cv.v)} % de los votos`);
  if (ord[0]) T.push(`${ord[0].n}, primera fuerza en el Congreso con ${esc(ord[0].s)}`);
  T.push(ord[0] && ord[0].s>=E.mayoria ? `${ord[0].n} logra la mayoría absoluta (${E.mayoria})` : `Ningún partido alcanza en solitario la mayoría absoluta de ${E.mayoria} escaños`);
  const con = ord.filter(x=>x.s23!=null);
  const sube = [...con].sort((a,b)=>(b.s-b.s23)-(a.s-a.s23))[0], baja = [...con].sort((a,b)=>(a.s-a.s23)-(b.s-b.s23))[0];
  if (sube && sube.s>sube.s23) T.push(`${sube.n} es el que más crece: ${sube.s23} → ${sube.s} escaños`);
  if (baja && baja.s<baja.s23) T.push(`${baja.n} es el que más retrocede: ${baja.s23} → ${baja.s} escaños`);
  if (E.participacion) T.push(`Participación en España: ${fmt(E.participacion)} % (${fmt(E.participacion23)} % en 2023)`);
  if (C.participacion) T.push(`Participación en Cantabria: ${fmt(C.participacion)} % (${fmt(C.participacion23)} % en 2023)`);
  return T.map(t=>({ t }));
}

function render(){
  const porEsc = [...E.partidos].filter(x=>x.n!=="Otros").sort((a,b)=>b.s-a.s);
  const otros = E.partidos.find(x=>x.n==="Otros");
  const dif = x => x.s23==null ? "&nbsp;" : (x.s-x.s23>0 ? `<span class="sube">▲ ${x.s-x.s23}</span>` : x.s-x.s23<0 ? `<span class="baja">▼ ${x.s23-x.s}</span>` : "= 2023");
  const tarjetasDe = (lista, actual) => lista.map(x=>`<div class="pc" style="--c:${x.c}"><div class="n">${x.n}</div><div class="num" data-num="${x.s}">0</div>${actual ? `<div class="d">${dif(x)}</div><div class="ant">${x.s23==null ? "No estaba en 2023" : "2023: " + x.s23}</div>` : ""}</div>`).join("");
  const tarjetas = tarjetasDe(porEsc.concat(otros?[otros]:[]), true);
  const ant = E.anterior;
  const tarjetas23 = ant ? tarjetasDe([...ant.partidos].sort((a,b)=>b.s-a.s), false) : "";

  const maxC = Math.max(...C.partidos.map(x=>x.v));
  const cseats = C.partidos.flatMap(x=>Array(x.s).fill(x)).map((x,i)=>`<span class="cseat" style="background:${x.c};animation-delay:${300+i*120}ms">${sigla(x.n)}</span>`).join("");
  const maxB = Math.max(maxC, ...C.partidos.map(x=>x.v23||0));
  const esc = n => n + " " + (n===1 ? "escaño" : "escaños");
  const cfilas = C.partidos.map(x=>{
    const cmp = x.v23==null ? "No se presentaba en 2023"
      : `2023: ${fmt(x.v23)}%${x.s23!=null ? " · " + esc(x.s23) : ""} <b class="${x.v>=x.v23?"sube":"baja"}">(${x.v>=x.v23?"+":"−"}${fmt(Math.abs(x.v-x.v23))} puntos)</b>`;
    return `<div class="fila"><div class="top"><span><i style="background:${x.c}"></i>${x.n}${x.s?` · ${esc(x.s)}`:""}</span><b class="num" data-num="${x.v}" data-dec="1" data-suf="%">0</b></div><div class="barra"><div data-w="${x.v/maxB*100}" style="background:${x.c}"></div>${x.v23!=null?`<span class="ant23" style="left:${x.v23/maxB*100}%" title="2023: ${fmt(x.v23)}%"></span>`:""}</div><div class="cmp">${cmp}</div></div>`;
  }).join("");

  const chips = porEsc.map(x=>`<button type="button" class="chip" aria-pressed="false" data-n="${x.n}" style="--c:${x.c}"><i></i>${x.n} <b>${x.s}</b></button>`).join("");
  const marcaPct = E.mayoria / E.total * 100;

  el.innerHTML = `
    <div class="hero">
      <div><span class="pill"><i></i>Resultados</span><h1>Elecciones generales <span>29-N</span></h1></div>
      <div class="escr"><div class="num" data-num="${VER.escrutado}" data-dec="1" data-suf="%">0</div><small>Escrutado</small></div>
    </div>
    ${VER.prueba ? '<div class="prueba">DATOS DE PRUEBA · NO SON RESULTADOS REALES</div>' : ''}
    <div class="tk" aria-live="polite"><div class="tk-l"><i></i><span>Última hora</span></div><div class="tk-t" id="tk"></div><div class="tk-n" id="tkn"></div></div>
    <div class="tabs" role="tablist">
      <button data-t="cantabria" class="on" role="tab">Cantabria</button>
      <button data-t="espana" role="tab">España</button>
      <button data-t="pacto" role="tab">Pactómetro</button>
    </div>
    <div class="cuerpo">
      <div class="card t-es">
        <div class="tit"><span>España · <b>Congreso</b></span>${ant ? `<span class="anio" role="group" aria-label="Elegir elecciones"><button type="button" class="on" data-a="2026">29-N 2026</button><button type="button" data-a="2023">${ant.titulo}</button></span>` : ""}</div>
        <div class="hemi-w"><div id="hemi">${hemicycle(E.partidos, E.total)}</div><div class="hemi-c"><div class="num">${E.mayoria}</div><small>Mayoría absoluta</small></div></div>
        <div class="partidos" id="tarj">${tarjetas}</div>
        <div class="ley">Participación: <b style="color:#fff">${fmt(E.participacion)}%</b> · en 2023: ${fmt(E.participacion23)}%</div>
      </div>
      <div class="card cant t-ca">
        <div class="tit"><span>Cantabria · <b>5 diputados</b></span></div>
        <div class="seats">${cseats}</div>
        ${cfilas}
        <div class="ley"><i></i> La marca blanca es el resultado de 2023</div>
        <div class="part"><span>Participación en Cantabria<br><small>2023: ${fmt(C.participacion23)}%</small></span><span class="num" data-num="${C.participacion}" data-dec="1" data-suf="%">0</span></div>
      </div>
    </div>
    <div class="pacto t-pa">
      <div class="tit"><span>Pactómetro · <b>¿quién suma ${E.mayoria}?</b></span></div>
      <div class="chips">${chips}</div>
      <div class="medidor" id="medidor"><i class="marca" style="left:${marcaPct}%"></i></div>
      <div class="marca-t"><span style="left:${marcaPct}%">${E.mayoria}</span></div>
      <div class="res"><div class="num" id="suma">0<small>escaños</small></div><div class="ver" id="ver">Toca los partidos</div></div>
      <button class="limpiar" id="limpiar" type="button">Empezar de nuevo</button>
    </div>
    <div class="pie"><span><b>CantabriaPress</b> · ${VER.actualizado}</span><span>Fuente: ${VER.fuente}</span></div>`;

  contar(el);

  // titulares que van saliendo cada 5 segundos
  const TIT = (VER.titulares && VER.titulares.length) ? VER.titulares : titularesAuto();
  const tk = el.querySelector("#tk"), tkn = el.querySelector("#tkn");
  tk.innerHTML = TIT.map(x=>`<p>${x.hora?`<small>${x.hora}</small>`:""}<span>${x.t}</span></p>`).join("");
  tkn.innerHTML = TIT.map((_,i)=>`<button type="button" aria-label="Titular ${i+1}"></button>`).join("");
  let ti = 0, tt;
  const ver = i => { ti = (i+TIT.length)%TIT.length;
    tk.querySelectorAll("p").forEach((p,j)=>p.classList.toggle("on", j===ti));
    tkn.querySelectorAll("button").forEach((b,j)=>b.classList.toggle("on", j===ti)); };
  const sig = () => { clearTimeout(tt); tt = setTimeout(()=>{ ver(ti+1); sig(); }, 5000); };
  tkn.querySelectorAll("button").forEach((b,j)=>b.addEventListener("click",()=>{ ver(j); sig(); }));
  tk.addEventListener("click",()=>{ ver(ti+1); sig(); });
  ver(0); if (TIT.length>1) sig();
  requestAnimationFrame(()=>setTimeout(()=>el.querySelectorAll(".barra div").forEach(b=>b.style.width=b.dataset.w+"%"),50));

  // 2026 / 2023 en el Congreso
  el.querySelectorAll(".anio button").forEach(b=>b.addEventListener("click",()=>{
    const es23 = b.dataset.a === "2023";
    el.querySelectorAll(".anio button").forEach(x=>x.classList.toggle("on", x===b));
    el.querySelector("#hemi").innerHTML = hemicycle(es23 ? ant.partidos : E.partidos, E.total);
    const tj = el.querySelector("#tarj"); tj.innerHTML = es23 ? tarjetas23 : tarjetas; contar(tj);
    sendHeight();
  }));

  // pestañas (móvil)
  el.dataset.tab = "cantabria";
  el.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
    el.dataset.tab = b.dataset.t;
    el.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on", x===b));
    sendHeight();
  }));

  // pactómetro
  const elegidos = new Set(), medidor = el.querySelector("#medidor");
  function actualizar(){
    const sel = porEsc.filter(x=>elegidos.has(x.n));
    const total = sel.reduce((a,b)=>a+b.s,0);
    medidor.querySelectorAll("span").forEach(s=>s.remove());
    sel.forEach(x=>{ const s=document.createElement("span"); s.style.width=(x.s/E.total*100)+"%"; s.style.background=x.c; medidor.appendChild(s); });
    el.querySelector("#suma").innerHTML = `${total}<small>escaños</small>`;
    const v = el.querySelector("#ver");
    if (!sel.length){ v.textContent = "Toca los partidos"; v.className = "ver"; }
    else if (total >= E.mayoria){ v.textContent = "✓ Mayoría absoluta"; v.className = "ver si"; }
    else { v.textContent = `Faltan ${E.mayoria - total}`; v.className = "ver"; }
  }
  el.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
    const on = !elegidos.has(b.dataset.n);
    on ? elegidos.add(b.dataset.n) : elegidos.delete(b.dataset.n);
    b.setAttribute("aria-pressed", on);
    actualizar();
  }));
  el.querySelector("#limpiar").addEventListener("click",()=>{
    elegidos.clear(); el.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed","false")); actualizar();
  });
}
function renderEspera(){
  el.innerHTML = `
    <div class="hero">
      <div><span class="pill"><i></i>Noche electoral</span><h1>Elecciones generales <span>29-N</span></h1></div>
      <div class="escr"><div class="num">0,0%</div><small>Escrutado</small></div>
    </div>
    <div class="espera">
      <div class="big">Los colegios cierran a las 20:00</div>
      <p>Los resultados oficiales de Cantabria y de España aparecerán aquí en cuanto empiece el escrutinio, con el pactómetro para que hagas tus propias cuentas.</p>
    </div>
    <div class="pie"><span><b>CantabriaPress</b> · Elecciones generales · 29 de noviembre de 2026</span><span>Fuente: Ministerio del Interior</span></div>`;
}
if (VER.datos) render(); else renderEspera();

/* Avisa a la página que lo contiene de la altura (mismo aviso que el banner de encuestas) */
function sendHeight(){ try{ parent.postMessage({cpEncuestasAltura: Math.ceil(document.getElementById("rb").getBoundingClientRect().height) + 2}, "*"); }catch(e){} }
window.addEventListener("load", sendHeight);
window.addEventListener("resize", sendHeight);
setTimeout(sendHeight, 600); setTimeout(sendHeight, 1500);
</script>
</body>
</html>
