<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner encuestas 29-N Cantabria · CantabriaPress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* Estilo del tema Newspaper (tagDiv) con el verde de cantabriapress.com */
  :root{
    --ink:#111111; --muted:#767676; --line:#ededed; --bg:#ffffff; --soft:#f7f7f7;
    --accent:#2a8647;        /* verde de la barra de menú de CantabriaPress */
    --accent-dark:#195136;
    --accent-soft:#f2f8f4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Roboto,Verdana,Geneva,sans-serif;color:var(--ink);background:transparent;padding:0}
  .preview-note{max-width:980px;margin:0 auto 14px;font-size:13px;color:var(--muted)}

  .cp-banner{max-width:100%;margin:0;background:var(--bg);border:1px solid var(--line)}
  /* cabecera tipo "td-block-title": etiqueta verde + línea verde debajo */
  .cp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--accent);flex-wrap:wrap;padding-right:14px}
  .cp-kicker{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .cp-tag{background:var(--accent);color:#fff;font-weight:500;font-size:14px;line-height:1;text-transform:uppercase;padding:9px 14px 8px;white-space:nowrap}
  .cp-title{font-weight:700;font-size:20px;line-height:1.2;padding:8px 0}
  .cp-count{font-size:13px;color:var(--muted);padding:8px 0}
  .cp-count b{color:var(--accent);font-weight:900;font-variant-numeric:tabular-nums}

  .cp-body{display:grid;grid-template-columns:1.1fr 1.1fr 1fr;gap:0}
  .cp-col{padding:14px 18px}
  .cp-col + .cp-col{border-left:1px solid var(--line)}
  .cp-h{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--ink);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .cp-h::before{content:"";display:inline-block;width:3px;height:11px;background:var(--accent);margin-right:6px;vertical-align:-1px}

  .row{display:grid;grid-template-columns:112px 1fr 46px;align-items:center;gap:8px;margin:7px 0}
  .pname{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .track{height:14px;background:var(--soft);overflow:hidden}
  .bar{height:100%;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .val{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

  .hemi{display:block;width:100%;max-width:260px;margin:0 auto}
  .seats{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:6px}
  .seat{font-size:12px;display:flex;align-items:center;gap:5px}
  .seat b{font-variant-numeric:tabular-nums}
  .maj{font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px}

  .cp-col.cant{background:var(--accent-soft)}
  .cant-seats{display:flex;gap:8px;justify-content:center;margin:8px 0 8px}
  .cseat{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .cant-list{font-size:14px;text-align:center;line-height:1.6}
  .cant-sum{font-size:12.5px;text-align:center;color:var(--ink);margin:6px 0 10px}
  .cant-polls{list-style:none;border-top:1px solid var(--line);margin-bottom:12px}
  .cant-polls li{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
  .cant-polls em{font-style:normal;color:var(--muted)}
  .cant-polls b{white-space:nowrap}
  .cp-h.sub{margin:4px 0 4px}
  .row.sm{grid-template-columns:62px 1fr 46px;margin:5px 0}
  .row.sm .track{height:10px}

  .src{font-size:11px;color:var(--muted);line-height:1.45;margin-top:8px}
  .cp-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 18px;background:var(--soft);border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  .cp-foot b{color:var(--accent)}

  /* pactómetro */
  .pact{padding:12px 18px 14px;border-top:1px solid var(--line)}
  .pact-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 28px}
  .prow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:3px 10px;align-items:center;margin:6px 0}
  .plab{grid-column:1/-1;font-size:12.5px;font-weight:600}
  .ptrack{position:relative;height:16px;background:var(--soft);display:flex}
  .ptrack span{height:100%;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .ptrack i{position:absolute;left:50.29%;top:-3px;bottom:-3px;border-left:2px dashed #16181d}
  .ptot{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ptot small{font-weight:500;color:var(--muted);font-size:11px}
  .ptot.ok small{color:var(--accent);font-weight:700}
  @media (max-width:760px){ .pact{padding:10px 14px 12px} .pact-grid{grid-template-columns:1fr} }

  .cp-quiet{padding:28px 18px;text-align:center}
  .cp-quiet .big{font-weight:900;font-size:28px;color:var(--accent);margin-bottom:6px}
  .cp-quiet p{font-size:13px;color:var(--muted);max-width:560px;margin:0 auto}

  /* pestañas: solo en móvil */
  .cp-tabs{display:none}
  .cp-mini{display:none}
  @media (max-width:760px){
    .cp-head{flex-wrap:nowrap;align-items:center;padding-right:10px}
    .cp-title{display:none}
    .cp-tag{font-size:13px;padding:9px 12px 8px}
    .cp-count{font-size:12px;padding:0;text-align:right}
    /* recuadro plegado */
    .cp-mini{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .cp-mini .mini-seats{display:flex;gap:3px;flex:none}
    .cp-mini .ms{width:18px;height:18px;border-radius:50%}
    .cp-mini .mini-txt{flex:1;font-size:13px;line-height:1.3}
    .cp-mini .mini-txt b{font-weight:700}
    .cp-mini .mini-txt small{display:block;color:var(--muted);font-size:11px}
    .cp-mini .mini-btn{flex:none;background:var(--accent);color:#fff;border:0;font:700 11px Roboto,sans-serif;text-transform:uppercase;padding:7px 9px;cursor:pointer;white-space:nowrap}
    .cp-banner[data-open="0"] .cp-more{display:none}
    .cp-banner[data-open="1"] .cp-mini{border-bottom:1px solid var(--line)}
    .cp-tabs{display:flex;border-bottom:1px solid var(--line)}
    .cp-tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px 0 7px;font:700 13px Roboto,sans-serif;text-transform:uppercase;color:var(--muted);cursor:pointer}
    .cp-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
    .cp-body{display:block}
    .cp-col{padding:12px 14px}
    .cp-col + .cp-col{border-left:0;border-top:0}
    .cp-banner[data-tab="cantabria"] .t-es,
    .cp-banner[data-tab="espana"] .t-ca{display:none}
    .m-hide{display:none !important}
    .cseat{width:38px;height:38px;font-size:10px}
    .cant-sum{margin:4px 0 8px}
    .cant-polls{margin-bottom:6px}
    .cp-h{margin-bottom:6px}
    .row{margin:5px 0}
    .seats{margin-top:2px}
    .cp-foot{padding:6px 14px}
  }
</style>
</head>
<body>


<div class="cp-banner" id="cp-banner"></div>

<script>

    { n: "PSOE + Frente Amplio", p: ["PSOE","Frente Amplio"] },
    { n: "PSOE + Frente Amplio + socios de la investidura de 2023", p: ["PSOE","Frente Amplio","ERC","Junts","EH Bildu","PNV","BNG","CC"] },
    { n: "PP + PSOE", p: ["PP","PSOE"] }
  ]
};

/* ============================================================
   LÓGICA DEL BANNER
   ============================================================ */
const el = document.getElementById("cp-banner");
const fmt = n => n.toLocaleString("es-ES",{minimumFractionDigits:1,maximumFractionDigits:1});

function madridToday(){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Madrid"}).format(new Date());
}
function daysLeft(){
  const ms = new Date(DATA.eleccion) - new Date();
  return Math.max(0, Math.ceil(ms / 86400000));
}
function header(sub, right){
  const d = daysLeft();
  return `<div class="cp-head">
    <div class="cp-kicker"><span class="cp-tag">Cantabria · 29-N</span><span class="cp-title">${sub}</span></div>
    <div class="cp-count">${right || (d>0?`Faltan <b>${d}</b> ${d===1?"día":"días"}<span class="m-hide"> para las elecciones generales</span>`:"Hoy se vota")}</div>
  </div>`;
}

/* Comportamiento común: recuadro plegable y pestañas en móvil */
function bindUI(){
  el.dataset.tab = "cantabria";
  el.dataset.open = "0";
  const mini = el.querySelector(".cp-mini"), mbtn = el.querySelector(".mini-btn");
  mini.addEventListener("click", ()=>{
    const open = el.dataset.open !== "1";
    el.dataset.open = open ? "1" : "0";
    mini.setAttribute("aria-expanded", open);
    mbtn.textContent = open ? "Cerrar ▴" : "Ver más ▾";
    if (typeof sendHeight==="function") sendHeight();
  });
  el.querySelectorAll(".cp-tabs button").forEach(b=>b.addEventListener("click",()=>{
    el.dataset.tab = b.dataset.t;
    el.querySelectorAll(".cp-tabs button").forEach(x=>x.classList.toggle("on", x===b));
    if (typeof sendHeight==="function") sendHeight();
  }));
  requestAnimationFrame(()=>document.querySelectorAll(".bar").forEach(b=>b.style.width=b.dataset.w+"%"));
}

function hemicycle(p, total){
  // semicírculo de escaños en filas
  const rows = 10, R0 = 40, R1 = 120, cx = 130, cy = 128;
  const radii = Array.from({length:rows},(_,i)=>R0+(R1-R0)*i/(rows-1));
  const sumR = radii.reduce((a,b)=>a+b,0);
  let counts = radii.map(r=>Math.round(total*r/sumR));
  counts[rows-1] += total - counts.reduce((a,b)=>a+b,0);
  const pts = [];
  radii.forEach((r,i)=>{
    const k = counts[i];
    for(let j=0;j<k;j++){
      const a = Math.PI - Math.PI*(j/(k-1||1));
      pts.push({a, x: cx + r*Math.cos(a), y: cy - r*Math.sin(a)});
    }
  });
  pts.sort((p1,p2)=>p2.a-p1.a);
  const colors = [];
  p.forEach(x=>{for(let i=0;i<x.s;i++)colors.push(x.c)});
  while(colors.length<total)colors.push("#d6d9de");
  const dots = pts.map((q,i)=>`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3.6" fill="${colors[i]}"/>`).join("");
  return `<svg class="hemi" viewBox="0 0 260 136" role="img" aria-label="Reparto de escaños">${dots}
    <line x1="130" y1="2" x2="130" y2="18" stroke="#16181d" stroke-width="1.2" stroke-dasharray="2 2"/></svg>`;
}

function renderPolls(){
  const m = DATA.media, u = DATA.ultima, c = DATA.cantabria;
  const max = Math.max(...m.partidos.map(x=>x.v));
  const bars = m.partidos.map(x=>`
    <div class="row">
      <div class="pname"><span class="dot" style="background:${x.c}"></span>${x.n}</div>
      <div class="track"><div class="bar" data-w="${(x.v/(max*1.08))*100}" style="background:${x.c}"></div></div>
      <div class="val">${fmt(x.v)}%</div>
    </div>`).join("");

  const ordered = [...u.partidos];
  const der = u.partidos.filter(x=>["PP","Vox"].includes(x.n)).reduce((a,b)=>a+b.s,0);
  const seats = u.partidos.map(x=>`<span class="seat"><span class="dot" style="background:${x.c}"></span>${x.n} <b>${x.s}</b></span>`).join("");

  const cseats = c.partidos.flatMap(x=>Array(x.s).fill(x)).map(x=>`<span class="cseat" style="background:${x.c}">${x.n}</span>`).join("");
  const clist = c.partidos.map(x=>`${x.n} <b>${x.s}</b>`).join(" · ");
  const cpolls = c.encuestas.map(e=>`<li><span>${e.quien} <em>${e.fecha}</em></span><b>${e.rep}</b></li>`).join("");
  const c23 = c.en2023.partidos.map(x=>`
    <div class="row sm">
      <div class="pname"><span class="dot" style="background:${x.c}"></span>${x.n}</div>
      <div class="track"><div class="bar" data-w="${x.v/0.5}" style="background:${x.c}"></div></div>
      <div class="val">${fmt(x.v)}%</div>
    </div>`).join("");

  el.innerHTML = header("Así van las encuestas en Cantabria") + `
    <div class="cp-mini" role="button" aria-expanded="false">
      <div class="mini-seats">${c.partidos.flatMap(x=>Array(x.s).fill(x.c)).map(col=>`<span class="ms" style="background:${col}"></span>`).join("")}</div>
      <div class="mini-txt"><b>Cantabria:</b> ${c.partidos.map(x=>`${x.n} ${x.s}`).join(" · ")}<small>España: ${m.partidos.slice(0,3).map(x=>`${x.n} ${fmt(x.v)}%`).join(" · ")}</small></div>
      <button class="mini-btn" type="button">Ver más ▾</button>
    </div>
    <div class="cp-more">
    <div class="cp-tabs" role="tablist">
      <button data-t="cantabria" class="on" role="tab">Cantabria</button>
      <button data-t="espana" role="tab">España</button>
    </div>
    <div class="cp-body">
      <div class="cp-col cant t-ca">
        <div class="cp-h">${c.titulo}</div>
        <div class="cant-seats">${cseats}</div>
        <div class="cant-list">${clist}</div>
        <p class="cant-sum">${c.resumen}</p>
        <ul class="cant-polls">${cpolls}</ul>
        <div class="m-hide">
          <div class="cp-h sub">${c.en2023.titulo}</div>
          ${c23}
          <div class="src">${c.fuente}</div>
        </div>
      </div>
      <div class="cp-col t-es">
        <div class="cp-h">España · ${m.titulo}</div>
        ${bars}
        <div class="src">${m.fuente}</div>
      </div>
      <div class="cp-col t-es">
        <div class="cp-h">España · ${u.titulo}</div>
        <div class="m-hide">${hemicycle(ordered, u.total)}</div>
        <div class="seats">${seats}</div>
        <div class="maj">Mayoría absoluta: ${u.mayoria} · PP + Vox: ${der}</div>
        <div class="src">${u.fuente}</div>
      </div>
    </div>
    <div class="cp-foot"><span><b>CantabriaPress</b> · Actualizado: ${DATA.actualizado}</span><span class="m-hide">Las encuestas no se publican del 24 al 28 de noviembre (LOREG, art. 69.7).</span></div>
    </div>`;
  bindUI();
}

function renderVeda(){
  el.innerHTML = header("Cuenta atrás para el 29-N") + `
    <div class="cp-quiet">
      <div class="big">${daysLeft()} ${daysLeft()===1?"día":"días"} para votar</div>
      <p>La ley electoral no permite publicar encuestas en los cinco días previos a la votación. El domingo 29, desde las 20:00, seguiremos aquí en directo el escrutinio en Cantabria y en España.</p>
    </div>
    <div class="cp-foot"><span>CantabriaPress</span><span>Elecciones generales · 29 de noviembre de 2026</span></div>`;
}

function renderResultados(){
  const r = DATA.resultados;
  if (!r){
    el.innerHTML = header("Resultados en directo") + `
    <div class="cp-quiet">
      <div class="big">Escrutinio del 29-N</div>
      <p>Los colegios cierran a las 20:00. Los resultados oficiales aparecerán aquí en cuanto empiece el recuento.</p>
    </div>
    <div class="cp-foot"><span>CantabriaPress</span><span>Elecciones generales · 29 de noviembre de 2026</span></div>`;
    return;
  }
  const c = r.cantabria, e = r.espana;
  const fin = c.escrutado >= 100 && e.escrutado >= 100;
  const voteBars = (list, sm) => {
    const max = Math.max(...list.map(x=>x.v||0), 1);
    return list.filter(x=>x.v!=null).map(x=>`
    <div class="row${sm?" sm":""}">
      <div class="pname"><span class="dot" style="background:${x.c}"></span>${x.n}</div>
      <div class="track"><div class="bar" data-w="${(x.v/(max*1.08))*100}" style="background:${x.c}"></div></div>
      <div class="val">${fmt(x.v)}%</div>
    </div>`).join("");
  };
  const cWin = c.partidos.filter(x=>x.s>0);
  const cseats = cWin.flatMap(x=>Array(x.s).fill(x)).map(x=>`<span class="cseat" style="background:${x.c}">${x.n}</span>`).join("");
  const clist = cWin.map(x=>`${x.n} <b>${x.s}</b>`).join(" · ");
  const eWin = e.partidos.filter(x=>x.s>0);
  const seats = eWin.map(x=>`<span class="seat"><span class="dot" style="background:${x.c}"></span>${x.n} <b>${x.s}</b></span>`).join("");
  const top = [...eWin].sort((a,b)=>b.s-a.s).slice(0,3);
  const esc = n => `${fmt(n)}%`;

  // Pactómetro: suma de escaños de cada combinación, de mayor a menor
  const seatsOf = Object.fromEntries(e.partidos.map(x=>[x.n, x]));
  const pactos = (DATA.pactos||[]).map(pk=>{
    const parts = pk.p.map(n=>seatsOf[n]).filter(x=>x && x.s>0);
    return { n: pk.n, parts, total: parts.reduce((a,b)=>a+b.s,0) };
  }).filter(pk=>pk.parts.length).sort((a,b)=>b.total-a.total);
  const pactHTML = pactos.length ? `
    <div class="pact t-es">
      <div class="cp-h">España · pactómetro <span style="font-weight:500;text-transform:none;color:var(--muted)">(mayoría absoluta: ${e.mayoria})</span></div>
      <div class="pact-grid">${pactos.map(pk=>`
        <div class="prow">
          <div class="plab">${pk.n}</div>
          <div class="ptrack">${pk.parts.map(x=>`<span title="${x.n} ${x.s}" style="background:${x.c};width:${x.s/e.total*100}%"></span>`).join("")}<i></i></div>
          <div class="ptot${pk.total>=e.mayoria?" ok":""}">${pk.total} <small>${pk.total>=e.mayoria?"✓ mayoría":`faltan ${e.mayoria-pk.total}`}</small></div>
        </div>`).join("")}
      </div>
    </div>` : "";

  el.innerHTML = header(fin ? "Resultados definitivos" : "Resultados en directo",
      `Escrutado en Cantabria <b>${esc(c.escrutado)}</b>`) + `
    <div class="cp-mini" role="button" aria-expanded="false">
      <div class="mini-seats">${cWin.flatMap(x=>Array(x.s).fill(x.c)).map(col=>`<span class="ms" style="background:${col}"></span>`).join("")}</div>
      <div class="mini-txt"><b>Cantabria:</b> ${cWin.map(x=>`${x.n} ${x.s}`).join(" · ")}<small>España: ${top.map(x=>`${x.n} ${x.s}`).join(" · ")} escaños</small></div>
      <button class="mini-btn" type="button">Ver más ▾</button>
    </div>
    <div class="cp-more">
    <div class="cp-tabs" role="tablist">
      <button data-t="cantabria" class="on" role="tab">Cantabria</button>
      <button data-t="espana" role="tab">España</button>
    </div>
    <div class="cp-body">
      <div class="cp-col cant t-ca">
        <div class="cp-h">Cantabria · los 5 diputados</div>
        <div class="cant-seats">${cseats}</div>
        <div class="cant-list">${clist}</div>
        <p class="cant-sum">Escrutado ${esc(c.escrutado)} · Participación ${esc(c.participacion)}</p>
        <div class="cp-h sub">Voto en Cantabria</div>
        ${voteBars(c.partidos)}
      </div>
      <div class="cp-col t-es">
        <div class="cp-h">España · escaños</div>
        <div class="m-hide">${hemicycle(e.partidos, e.total)}</div>
        <div class="seats">${seats}</div>
        <div class="maj">Mayoría absoluta: ${e.mayoria} · Escrutado ${esc(e.escrutado)} · Participación ${esc(e.participacion)}</div>
      </div>
      <div class="cp-col t-es">
        <div class="cp-h">España · porcentaje de voto</div>
        ${voteBars(e.partidos.filter(x=>x.n!=="Otros" && x.v!=null).sort((a,b)=>b.v-a.v).slice(0,7))}
        <div class="src">${r.fuente}</div>
      </div>
    </div>
    ${pactHTML}
    <div class="cp-foot"><span><b>CantabriaPress</b> · Actualizado: ${r.hora}</span><span class="m-hide">${fin ? "Escrutinio al 100%." : "Datos provisionales del escrutinio oficial."}</span></div>
    </div>`;
  bindUI();
}

const today = madridToday();
const forced = (location.hash||"").replace("#","");   // #encuestas, #veda, #resultados para previsualizar
if (forced==="veda") renderVeda();
else if (forced==="resultados") renderResultados();
else if (forced==="encuestas") renderPolls();
else if (today <= DATA.ultimoDiaEncuestas) renderPolls();
else if (today < "2026-11-29") renderVeda();
else renderResultados();

/* Avisa a la página que lo contiene de la altura, para que el iframe se ajuste solo */
function sendHeight(){ try{ parent.postMessage({cpEncuestasAltura: Math.ceil(document.getElementById("cp-banner").getBoundingClientRect().height) + 2}, "*"); }catch(e){} }
window.addEventListener("load", sendHeight);
window.addEventListener("resize", sendHeight);
setTimeout(sendHeight, 600); setTimeout(sendHeight, 1500);
</script>
