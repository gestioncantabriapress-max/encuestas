<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cantabria FM en directo</title>
<style>
  :root{
    --bg:#ffffff; --fg:#14181f; --muted:#5b6472; --line:#e3e6eb;
    --accent:#e30000; --accent-fg:#ffffff; --track:#e3e6eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .player{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;min-height:76px}
  .play{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
  .play:hover{transform:scale(1.05)}
  .play:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
  .play:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .play svg{width:22px;height:22px;fill:currentColor}
  .info{flex:1;min-width:0}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .logo{flex:none;height:44px;width:auto;display:block}
  .name{font-weight:900;font-size:18px;white-space:nowrap;text-transform:uppercase;letter-spacing:.01em}
  .name .fm{color:var(--accent)}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .playing .dot{animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,0,0,.55)}70%{box-shadow:0 0 0 8px rgba(227,0,0,0)}100%{box-shadow:0 0 0 0 rgba(227,0,0,0)}}
  .status{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bars{display:none;gap:2px;align-items:flex-end;height:14px}
  .playing .bars{display:inline-flex}
  .bars i{width:3px;background:var(--accent);border-radius:1px;animation:eq 1s infinite ease-in-out}
  .bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}.bars i:nth-child(4){animation-delay:.1s}
  @keyframes eq{0%,100%{height:4px}50%{height:14px}}
  .vol{flex:none;display:flex;align-items:center;gap:8px}
  .mute{border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;width:32px;height:32px;border-radius:6px}
  .mute:focus-visible{outline:2px solid var(--fg)}
  .mute svg{width:20px;height:20px;fill:currentColor}
  input[type=range]{width:90px;accent-color:var(--accent)}
  @media (max-width:420px){ input[type=range]{display:none} .name{font-size:15px} .name .esc{display:none} }
  /* Modo cabecera: barra fina (?modo=cabecera) */
  .cabecera .player{border:0;border-bottom:1px solid var(--line);border-radius:0;min-height:48px;padding:6px 16px;gap:10px}
  .cabecera .play{width:36px;height:36px}
  .cabecera .play svg{width:16px;height:16px}
  .cabecera .info{display:flex;align-items:center;gap:12px}
  .cabecera .name{font-size:16px}
  .cabecera .logo{height:34px}
  .cabecera .status{margin-top:0}
  .pop{flex:none;border:0;background:none;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:6px;display:none;place-items:center}
  .pop svg{width:18px;height:18px;fill:currentColor}
  .pop:focus-visible{outline:2px solid var(--fg)}
  .con-ventana .pop{display:grid}
  .cabecera .top{flex-wrap:nowrap}
  @media (max-width:760px){ .cabecera .status{display:none} }
  @media (max-width:440px){ .cabecera .live-t{display:none} .cabecera .logo{height:30px} .cabecera .player{padding:6px 10px} }
  @media (prefers-reduced-motion:reduce){ .playing .dot,.bars i{animation:none} .bars i{height:10px} }
</style>
</head>
<body>
<div class="player" id="player">
  <img class="logo" src="logo-color.png" alt="Cantabria FM">
  <button class="play" id="play" aria-label="Escuchar en directo">
    <svg id="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <div class="info">
    <div class="top">
      <span class="name"><span class="esc">Escucha </span>Cantabria <span class="fm">FM</span></span>
      <span class="live"><span class="dot"></span><span class="live-t">En directo</span></span>
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <div class="vol">
    <button class="mute" id="mute" aria-label="Silenciar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="volpath" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    </button>
    <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8" aria-label="Volumen">
  </div>
  <button class="pop" id="pop" aria-label="Escuchar en ventana aparte" title="Escuchar en ventana aparte (sigue sonando al navegar)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H5v12h12v-6h2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
  </button>
</div>

<script>
/* ====== CONFIGURACIÓN: cambia solo esto ====== */
const CONFIG = {
  emisora: "Cantabria FM",
  eslogan: "Pulsa para escuchar la radio en directo",
  // URL directa del stream (https). Admite .mp3, .aac, Icecast/Shoutcast y .m3u8 (HLS).
  stream: "",
  color: "#e30000"          // rojo Cantabria FM
};
/* ============================================== */

const $ = id => document.getElementById(id);
const audio = new Audio();
audio.preload = "none";
let hls = null, playing = false;

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
const VOL_ON = "M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z";
const VOL_OFF = "M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z";

document.documentElement.style.setProperty("--accent", CONFIG.color);

// Modo: ?modo=cabecera (barra fina para la cabecera) · ?modo=ventana (ventana emergente)
const modo = new URLSearchParams(location.search).get("modo");
if (modo === "cabecera") document.documentElement.classList.add("cabecera", "con-ventana");
$("pop").addEventListener("click", () => {
  const w = window.open(location.pathname + "?modo=ventana", "cantabriafm", "width=420,height=130,resizable=yes");
  if (w){ stop(); setStatus("Sonando en la ventana aparte"); }
});
const setStatus = t => $("status").textContent = t;
setStatus(CONFIG.stream ? CONFIG.eslogan : "Falta configurar la URL del stream");
if (!CONFIG.stream) $("play").disabled = true;

function setUI(on){
  playing = on;
  $("player").classList.toggle("playing", on);
  $("icon").innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  $("play").setAttribute("aria-label", on ? "Pausar" : "Escuchar en directo");
}

function loadScript(src){
  return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
}

async function start(){
  setStatus("Conectando…");
  const isHls = /\.m3u8(\?|$)/i.test(CONFIG.stream);
  try{
    if (isHls && !audio.canPlayType("application/vnd.apple.mpegurl")){
      if (!window.Hls) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js");
      hls = new Hls(); hls.loadSource(CONFIG.stream); hls.attachMedia(audio);
    } else {
      // Se añade un parámetro para evitar que el navegador reproduzca audio antiguo en caché
      audio.src = CONFIG.stream + (isHls ? "" : (CONFIG.stream.includes("?") ? "&" : "?") + "t=" + Date.now());
    }
    await audio.play();
  }catch(e){ stop(); setStatus("No se ha podido conectar. Inténtalo de nuevo."); }
}

function stop(){
  audio.pause();
  if (hls){ hls.destroy(); hls = null; }
  audio.removeAttribute("src"); audio.load();   // corta la descarga: al volver, se reanuda en directo
  setUI(false);
}

$("play").addEventListener("click", () => {
  if (playing){ stop(); setStatus(CONFIG.eslogan); } else start();
});
audio.addEventListener("playing", () => { setUI(true); setStatus("Sonando en directo"); });
audio.addEventListener("waiting", () => { if (playing) setStatus("Cargando…"); });
audio.addEventListener("error", () => { if (audio.getAttribute("src")){ stop(); setStatus("Emisión no disponible en este momento"); } });

audio.volume = +$("volume").value;
$("volume").addEventListener("input", e => { audio.volume = +e.target.value; audio.muted = false; updVol(); });
$("mute").addEventListener("click", () => { audio.muted = !audio.muted; updVol(); });
function updVol(){
  const off = audio.muted || audio.volume === 0;
  $("volpath").setAttribute("d", off ? VOL_OFF : VOL_ON);
  $("mute").setAttribute("aria-label", off ? "Activar sonido" : "Silenciar");
}

if ("mediaSession" in navigator){
  navigator.mediaSession.metadata = new MediaMetadata({ title: "En directo", artist: CONFIG.emisora });
  navigator.mediaSession.setActionHandler("play", start);
  navigator.mediaSession.setActionHandler("pause", () => { stop(); setStatus(CONFIG.eslogan); });
}
</script>
</body>
</html>
